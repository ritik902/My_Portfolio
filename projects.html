<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Foundation:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/space.css" />
  <link rel="shortcut icon" href="assets/icons/favicon.ico" type="image/x-icon" />
  <meta name="description"
    content="Personal and open-source projects by Ritik Sharma — machine learning, computer vision, NLP and Python applications." />
  <title>Projects — Ritik Sharma</title>
  <style>
    body {
      font-family: "Edu NSW ACT Foundation", cursive;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }

    .zoom:hover img {
      transform: scale(1.1);
    }
  </style>
</head>

<body class="scroll-smooth text-white">

  <!-- floating nav: back to skills (the only page that links here) -->

  <a href="skills.html" aria-label="Back to skills"
    class="fixed top-4 left-4 sm:top-6 sm:left-6 z-50 inline-flex h-11 w-11 sm:h-12 sm:w-12 items-center justify-center rounded-full border border-white/25 bg-white/10 text-white backdrop-blur-md shadow-lg shadow-black/50 transition duration-300 hover:-translate-x-0.5 hover:bg-white/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/70">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16"
      aria-hidden="true">
      <path fill-rule="evenodd"
        d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z" />
    </svg>
  </a>

  <!-- Section: All Projects -->
  <div class="flex justify-center pt-20">
    <h1 class="sm:text-3xl text-2xl font-bold tracking-wider">Personal Projects</h1>
  </div>

  <div class="flex justify-center px-6 pt-3">
    <p class="text-center max-w-2xl tracking-wide">
      Side projects and open-source work. My production AI/ML work at Griffyn Robotech and
      HCL Tech is covered on the
      <a href="landing_page.html#experience" class="underline font-bold">experience</a>
      section of the home page.
    </p>
  </div>

  <!-- Filter Buttons -->
  <div class="flex justify-center mt-6 gap-2 sm:gap-4 flex-wrap px-4" id="filter-buttons">
    <button id="btn-all" onclick="filterProjects('all')" class="filter-btn bg-white text-black font-bold text-sm sm:text-base px-3 sm:px-4 py-2 rounded hover:bg-gray-200">All</button>
    <button id="btn-python" onclick="filterProjects('python')" class="filter-btn bg-white text-black font-bold text-sm sm:text-base px-3 sm:px-4 py-2 rounded hover:bg-gray-200">Python</button>
    <button id="btn-ml" onclick="filterProjects('ml')" class="filter-btn bg-white text-black font-bold text-sm sm:text-base px-3 sm:px-4 py-2 rounded hover:bg-gray-200">Machine Learning</button>
    <button id="btn-js" onclick="filterProjects('js')" class="filter-btn bg-white text-black font-bold text-sm sm:text-base px-3 sm:px-4 py-2 rounded hover:bg-gray-200">JavaScript</button>
    <button id="btn-html" onclick="filterProjects('html')" class="filter-btn bg-white text-black font-bold text-sm sm:text-base px-3 sm:px-4 py-2 rounded hover:bg-gray-200">HTML/CSS</button>
  </div>

  <!-- Projects Container -->
  <div class="container my-10 px-4 sm:px-6 mx-auto">
    <section class="mb-32">
      <div id="projects-container" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-10"></div>
    </section>
  </div>

  <footer class="body-font border-t-2 border-gray-100">
    <div class="container px-5 py-3 mx-auto flex items-center flex-col">
      <span class="text-lg lg:text-2xl font-medium tracking-widest">-- kEeP bUiLdInG --</span>
      <p class="text-md mt-1 tracking-widest">Made with ♥ by Ritik.</p>
    </div>
  </footer>

  <!-- Script: Load from JSON + Filter + Animate + Highlight Active Button -->
  <script>
    let allProjects = [];

    async function fetchProjects() {
      const res = await fetch('assets/data/projects.json');
      allProjects = await res.json();
      renderProjects('all');
    }

    function filterProjects(category) {
      renderProjects(category);

      // Remove active styles from all buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-white', 'text-black');
      });

      // Add active style to selected button
      const activeBtn = document.getElementById(`btn-${category}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-black');
        activeBtn.classList.add('bg-blue-600', 'text-white');
      }
    }

    function renderProjects(category) {
      const container = document.getElementById('projects-container');
      container.innerHTML = '';
      const filtered = category === 'all' ? allProjects : allProjects.filter(p => p.category === category);

      filtered.forEach((project, index) => {
        const card = document.createElement('div');
        card.className = `zoom shadow-lg rounded-lg relative overflow-hidden bg-no-repeat bg-cover border-2 border-white opacity-0 translate-y-5 transition-all duration-700 delay-[${index * 100}ms]`;
        card.style.backgroundPosition = '50%';
        card.innerHTML = `
          <img src="${project.image}" class="w-full transition duration-300 ease-linear align-middle opacity-70" />
          <a href="${project.link}" target="_blank">
            <div class="absolute inset-0 bg-black/30 flex items-end">
              <h5 class="text-lg font-bold text-white m-6">${project.title}</h5>
            </div>
            <div class="mask absolute inset-0 bg-white/15 opacity-0 hover:opacity-100 transition duration-300 ease-in-out"></div>
          </a>
        `;
        container.appendChild(card);
        requestAnimationFrame(() => {
          card.classList.remove('opacity-0', 'translate-y-5');
        });
      });
    }

    fetchProjects();

    // Highlight 'All' on page load
    window.onload = () => {
      const allBtn = document.getElementById('btn-all');
      allBtn.classList.remove('bg-white', 'text-black');
      allBtn.classList.add('bg-blue-600', 'text-white');
    };
  </script>

</body>

</html>
